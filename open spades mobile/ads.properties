# AdMob IDs for the Play Store build (not secret; safe to commit). From https://apps.admob.com:
#   admobAppId            Apps → OpenSpades → App settings → App ID            (ca-app-pub-XXXXXXXXXXXXXXXX~NNNNNNNNNN)
#   interstitialAdUnitId  Apps → OpenSpades → Ad units → the interstitial unit (ca-app-pub-XXXXXXXXXXXXXXXX/NNNNNNNNNN)
# Empty values mean Google's test IDs. Debug builds always use the test IDs. Release builds refuse them (see README → Ads).
admobAppId=
interstitialAdUnitId=
